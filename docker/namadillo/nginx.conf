server {
  listen 80;
  server_name localhost;

  # Root + SPA fallback
  root /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }

  # COEP/COOP for cross-origin isolation (use credentialless to allow opaque third-party)
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Resource policy
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # Misc security headers
  add_header Expect-CT "max-age=0" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), usb=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always; # only effective over HTTPS
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "0" always;
  # Static assets (optional cache; helps with nosniff consistency)
  location ~* \.(?:js|mjs|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  gzip off;
}
